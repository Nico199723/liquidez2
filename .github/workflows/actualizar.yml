name: actualizar-tablero
on:
  schedule:
    - cron: "0 12 * * 1-5"       # 09:00 Argentina
    - cron: "0 13-21 * * 1-5"    # cada hora, de 10:00 a 18:00 Argentina
    - cron: "30 22 * * 1-5"      # 19:30 Argentina
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update.py
      - name: Guardar cambios
        run: |
          git config user.name "tablero-bot"
          git config user.email "tablero-bot@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "Actualización automática"
          git push
